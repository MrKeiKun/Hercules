stages:
  - build
  - databases
  - extras

variables: &base_vars
  # Configure mariadb service (https://hub.docker.com/_/mariadb/)
  MYSQL_DATABASE: 'ragnarok'
  MYSQL_USER: 'ragnarok'
  MYSQL_PASSWORD: 'ragnarok'
  MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
  GIT_DEPTH: '3'
  DEBIAN_COMMON_PACKAGES: cmake make git python3 python3-venv libzstd-dev

.branch_exceptions: &branch_exceptions
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "rathena" && $CI_COMMIT_BRANCH != "coverity_scan"'

.prerequisites: &prerequisites
  before_script:
    - echo "Building $CI_JOB_NAME"
    - uname -a
    - ./tools/ci/retry.sh apt-get update
    - ./tools/ci/retry.sh apt-get install -y -qq $INSTALL_PACKAGES $DEBIAN_COMMON_PACKAGES
    - ./tools/ci/travis.sh importdb ragnarok ragnarok ragnarok $SQLHOST
    - ./tools/ci/travis.sh getplugins || true

.build_script: &build_script
  script:
    - ./tools/ci/travis.sh prepareenv
    - source .venv/bin/activate
    - ./tools/ci/travis.sh build $CONFIGURE_FLAGS
    - ./tools/ci/travis.sh $SANITIZER_BUILD_FLAG test ragnarok ragnarok ragnarok $SQLHOST
    - ./tools/ci/travis.sh $SANITIZER_BUILD_FLAG extratest

.mariadb_service: &mariadb_service
  image: debian:unstable
  services:
    - mariadb:latest
  variables:
    <<: *base_vars
    SQLHOST: mariadb

# Compilers
#
# Mirrors the gcc/clang matrix already exercised in .github/workflows/build.yml,
# .github/workflows/gcc_test.yml and clang_test.yml (oldest/newest supported
# compilers x renewal x client-type x http parser).

gcc-15:
  <<: *branch_exceptions
  <<: *prerequisites
  <<: *build_script
  <<: *mariadb_service
  stage: build
  parallel:
    matrix:
      - RENEWAL: ["", "-DENABLE_RENEWAL=OFF"]
        CLIENT_TYPE: ["", "-DENABLE_PACKETVER_RE=ON", "-DENABLE_PACKETVER_ZERO=ON"]
        HTTPLIB: ["", "-DWITH_HTTP_PARSER=llhttp"]
  variables:
    <<: *base_vars
    SQLHOST: mariadb
    INSTALL_PACKAGES: gcc-15 g++-15 mariadb-client libmariadb-dev
    CC: gcc-15
    CXX: g++-15
    SANITIZER_BUILD_FLAG: ''
    CONFIGURE_FLAGS: -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_BUILD_TYPE=Debug -DENABLE_WERROR=ON -DENABLE_BUILDBOT=ON -DBUILD_HPMHOOKING=ON $RENEWAL $CLIENT_TYPE $HTTPLIB

clang-21:
  <<: *branch_exceptions
  <<: *prerequisites
  <<: *build_script
  <<: *mariadb_service
  stage: build
  parallel:
    matrix:
      - RENEWAL: ["", "-DENABLE_RENEWAL=OFF"]
        CLIENT_TYPE: ["", "-DENABLE_PACKETVER_RE=ON", "-DENABLE_PACKETVER_ZERO=ON"]
        HTTPLIB: ["", "-DWITH_HTTP_PARSER=llhttp"]
  variables:
    <<: *base_vars
    SQLHOST: mariadb
    INSTALL_PACKAGES: clang-21 mariadb-client libmariadb-dev
    CC: clang-21
    CXX: clang++-21
    SANITIZER_BUILD_FLAG: ''
    CONFIGURE_FLAGS: -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 -DCMAKE_BUILD_TYPE=Debug -DENABLE_WERROR=ON -DENABLE_BUILDBOT=ON -DBUILD_HPMHOOKING=ON $RENEWAL $CLIENT_TYPE $HTTPLIB

gcc-15_sanitize:
  <<: *branch_exceptions
  <<: *prerequisites
  <<: *build_script
  <<: *mariadb_service
  stage: build
  parallel:
    matrix:
      - PACKET_VERSION: ["-DPACKETVER=20221024", "-DPACKETVER=20130724"]
  variables:
    <<: *base_vars
    SQLHOST: mariadb
    INSTALL_PACKAGES: gcc-15 g++-15 mariadb-client libmariadb-dev
    CC: gcc-15
    CXX: g++-15
    SANITIZER_BUILD_FLAG: '--sanitizer-build'
    CONFIGURE_FLAGS: -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_BUILD_TYPE=Debug -DENABLE_WERROR=ON -DENABLE_BUILDBOT=ON -DMEMORY_MANAGER=none -DENABLE_SANITIZE=ON $PACKET_VERSION

# Databases
#
# Mirrors .github/workflows/mariadb.yml and mysql.yml: build once per supported
# server version to catch SQL/driver regressions independent of compiler coverage.

mariadb:
  <<: *branch_exceptions
  <<: *prerequisites
  <<: *build_script
  stage: databases
  image: debian:unstable
  parallel:
    matrix:
      - MARIADB_VERSION: ["10.11", "11.8", "latest"]
  services:
    - name: mariadb:$MARIADB_VERSION
      alias: mariadb
  variables:
    <<: *base_vars
    SQLHOST: mariadb
    INSTALL_PACKAGES: gcc-15 g++-15 mariadb-client libmariadb-dev
    CC: gcc-15
    CXX: g++-15
    SANITIZER_BUILD_FLAG: ''
    CONFIGURE_FLAGS: -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_BUILD_TYPE=Debug -DENABLE_WERROR=ON -DENABLE_BUILDBOT=ON -DBUILD_HPMHOOKING=ON

mysql:
  <<: *branch_exceptions
  <<: *prerequisites
  <<: *build_script
  stage: databases
  image: debian:unstable
  parallel:
    matrix:
      - MYSQL_VERSION: ["5.7", "8.0", "latest"]
  services:
    - name: mysql:$MYSQL_VERSION
      alias: mysql
  variables:
    <<: *base_vars
    SQLHOST: mysql
    INSTALL_PACKAGES: gcc-15 g++-15 default-mysql-client default-libmysqlclient-dev
    CC: gcc-15
    CXX: g++-15
    SANITIZER_BUILD_FLAG: ''
    CONFIGURE_FLAGS: -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_BUILD_TYPE=Debug -DENABLE_WERROR=ON -DENABLE_BUILDBOT=ON -DBUILD_HPMHOOKING=ON

# Coverage
#
# Feeds the coverage badge in README.md (gitlab.com/HerculesWS/Hercules badges/master/coverage.svg).

coverage:
  <<: *branch_exceptions
  <<: *prerequisites
  <<: *mariadb_service
  stage: extras
  variables:
    <<: *base_vars
    SQLHOST: mariadb
    INSTALL_PACKAGES: gcc-15 g++-15 gcovr mariadb-client libmariadb-dev
    CC: gcc-15
    CXX: g++-15
    CONFIGURE_FLAGS: -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_BUILD_TYPE=Debug -DENABLE_WERROR=ON -DENABLE_BUILDBOT=ON -DBUILD_HPMHOOKING=ON -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
  script:
    - ./tools/ci/travis.sh prepareenv
    - source .venv/bin/activate
    - ./tools/ci/travis.sh build $CONFIGURE_FLAGS
    - ./tools/ci/travis.sh test ragnarok ragnarok ragnarok $SQLHOST
    - gcovr -r . --object-directory build --gcov-executable=gcov-15 -o gcov.txt
    - gcovr -r . --object-directory build --gcov-executable=gcov-15 --html -o gcov.html
    - cat gcov.txt
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  artifacts:
    paths:
      - gcov.*
    when: on_success

# Documentation

pages:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  stage: extras
  image: debian:unstable
  needs:
    - job: coverage
      artifacts: true
  before_script:
    - echo "Building $CI_JOB_NAME"
    - uname -a
    - ./tools/ci/retry.sh apt-get update
    - ./tools/ci/retry.sh apt-get install -y -qq $DEBIAN_COMMON_PACKAGES doxygen graphviz
  variables:
    <<: *base_vars
  script:
    - ./tools/ci/travis.sh prepareenv
    - source .venv/bin/activate
    - cmake -B build -S . -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake_modules/conan_provider.cmake
    - (cd build && make docs)
    - mkdir public
    - mv tools/doxygen/docs/html public/docs
    - mv gcov.* public/ || true
    - cp tools/doxygen/pages_index.html public/index.html
  artifacts:
    paths:
      - public
